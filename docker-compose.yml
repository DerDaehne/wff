services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wff}
      POSTGRES_DB: ${POSTGRES_DB:-wff}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wff}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: wff-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-wff}:${POSTGRES_PASSWORD:-wff}@db:5432/${POSTGRES_DB:-wff}?sslmode=disable
      UPLOAD_DIR: /data/uploads
      ENRICHMENT_POLL_INTERVAL: ${ENRICHMENT_POLL_INTERVAL:-1h}
      OPENMETEO_BASE_URL: ${OPENMETEO_BASE_URL:-}
    volumes:
      - upload-data:/data/uploads
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db-data:
  upload-data:
